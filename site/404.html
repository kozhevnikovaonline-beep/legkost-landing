<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Страница не найдена — «ЛЁГКОСТЬ»</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0B0F">
<link rel="icon" type="image/svg+xml" href="/legkost-landing/assets/icons/favicon.svg">
<style>
:root{--bg:#0E0B0F;--pink:#FF2E8A;--btn:#DB1068;--muted:#BFB2BA}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(700px 400px at 50% 110%,rgba(255,46,138,.35),transparent 70%),var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;text-align:center;padding:24px max(16px,env(safe-area-inset-left))}
.code{font:700 clamp(96px,28vw,200px)/.9 "Arial Narrow",Impact,sans-serif;color:transparent;-webkit-text-stroke:2px var(--pink);margin:0}
h1{font-size:clamp(22px,5vw,32px);margin:16px 0 10px;text-wrap:balance}
p{color:var(--muted);margin:0 auto 28px;max-width:420px;line-height:1.6;text-wrap:pretty}
a{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 28px;border-radius:999px;background:var(--btn);color:#fff;font-weight:800;text-decoration:none;box-shadow:0 10px 40px -8px rgba(255,46,138,.65)}
a:focus-visible{outline:3px solid #C6FF4A;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Всё самое важное — на главной: 3 бесплатных урока и подробности о курсе.</p>
  <a href="/legkost-landing/">На главную</a>
</main>
</body>
</html>
